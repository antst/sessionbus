name: Binary releases

on:
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: binary-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: deploy/check-release-tag "$RELEASE_TAG"
      - name: Validate source and build archives
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          go test ./...
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" deploy/package-release dist
          git rev-parse HEAD > dist/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish checksummed archives
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'development' }}
        run: |
          if [ "$VERSION" != development ] &&
             ! printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'Invalid release version' >&2
            exit 1
          fi
          cd dist
          sha256sum ./*.tar.gz | sed 's|  ./|  |' > SHA256SUMS
          sha=$(cat SOURCE.txt)
          if [ "$VERSION" = development ] && [ "$sha" != "$(gh api "repos/$REPO/branches/develop" --jq .commit.sha)" ]; then
            echo 'A newer develop commit exists; skip publishing this older build.'
            exit 0
          fi
          if [ "$VERSION" = development ]; then
            if gh release view development --repo "$REPO" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$REPO/git/refs/tags/development" -f sha="$sha" -F force=true
            else
              gh release create development --repo "$REPO" --target "$sha" --prerelease --title 'Development build' --notes 'Built from tested develop. Pin a versioned release for stable installations.'
            fi
            gh release upload development --repo "$REPO" --clobber ./*.tar.gz SOURCE.txt SHA256SUMS
          else
            gh release create "$VERSION" --repo "$REPO" --target "$sha" --title "$VERSION" --generate-notes ./*.tar.gz SOURCE.txt SHA256SUMS
          fi
      - name: Publish matching Go module tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: deploy/publish-go-tag "$RELEASE_TAG"
