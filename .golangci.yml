version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - durationcheck
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnesserr
    - nolintlint
    - reassign
    - recvcheck
    - staticcheck
    - unused
    - wastedassign
  settings:
    staticcheck:
      checks:
        - "SA*"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/antst/sessionbus

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
